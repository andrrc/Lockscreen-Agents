[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]  # lambdas atribuídas a nomes são usadas de propósito na janela de configurações

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"lockscreen_agents/i18n.py" = ["E501"]  # textos longos
"tools/*" = ["E402"]
"packaging/*" = ["E402"]
